# --- Database (MySQL, run via Docker - see README) ---
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:athens_tours_dev}?useSSL=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER:tours_user}
spring.datasource.password=${MYSQL_PASSWORD:tours_password}

# Schema is owned by Flyway migrations, Hibernate only validates the mapping
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

